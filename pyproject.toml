[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dota2-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "langchain-anthropic",
    "langgraph",
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "langchain>=1.3.7",
]

[project.scripts]
dota2-coach = "dota2_coach.app:app"

[dependency-groups]
dev = ["ruff", "ty"]
